apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-app-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jagadeeshkaranam99/gitops-infra-manifests.git
    targetRevision: main
    path: charts/flask-app
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
